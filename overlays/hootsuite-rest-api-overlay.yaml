- target: $.paths['/v1/messages'].post
  description: Flag the platform write that has no idempotency protection and fans out.
  update:
    x-agent-warning: 'This is a real publish to live social networks. It is NOT idempotent and there
      is no Idempotency-Key. It also FANS OUT: socialProfileIds is an array and the response is an array
      of one Message per profile, each with its own id. Pinterest cannot be bundled with any other profile.
      Check SocialProfile.isReauthRequired before scheduling - a value of 1 means the network token
      has lapsed and the publish will fail.'
    x-consequence: write
    x-reversible: Only while state is SCHEDULED, via DELETE /v1/messages/{messageId}.
- target: $.paths['/v1/media'].post
  description: Document the two-step presigned upload the spec does not model.
  update:
    x-agent-note: Two-step upload. This call returns an Amazon S3 uploadUrl; the bytes are then PUT
      to that URL with Content-Type and Content-Length matching the values declared here. Only the first
      valid upload to a URL is kept. Hootsuite deletes uploaded media 90 days after it is used in a
      message.
- target: $.paths['/v1/socialProfiles'].get
  description: Surface the field that predicts publish failure.
  update:
    x-agent-note: isReauthRequired = 1 means the upstream network token has lapsed. Every publish to
      that profile will fail until a human reconnects it. Filter on it before scheduling.
- target: $.tags[?(@.name=='SCIM 2.0')]
  description: Record the standard this tag implements.
  update:
    x-standard: SCIM 2.0 (RFC 7643 / RFC 7644); errors follow RFC 7644 section 3.12.
