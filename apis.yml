- aid: hootsuite:analytics-api
  name: Hootsuite Analytics REST API
  description: >-
    Organic and paid social analytics — published posts with lifetime metrics, daily profile
    metrics, and campaign / ad-set / ad entities and daily metrics for Facebook and Twitter ad
    accounts. Gated by the analytics:read OAuth scope, which must first be enabled on the app
    in the developer portal. Batches are capped at 10 profiles or 10 ad accounts per request.
  humanURL: https://developer.hootsuite.com/docs/analytics-overview
  baseURL: https://platform.hootsuite.com/v1/analytics
  tags:
