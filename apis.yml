- aid: hootsuite:mcp
  name: Hootsuite Developer Documentation MCP
  description: >-
    A remote Model Context Protocol endpoint served from Hootsuite's own ReadMe-hosted
    developer documentation site. Reachable and real, but gated — initialize and tools/list
    both return HTTP 401 "Authorization required" with no WWW-Authenticate challenge and no
    OAuth protected-resource metadata to negotiate against, so the tool list could not be
    read anonymously. It is a documentation server, not a wrapper over the platform APIs.
  humanURL: https://developer.hootsuite.com
  baseURL: https://developer.hootsuite.com/mcp
  tags:
  - MCP
  - Documentation
  - Agents
