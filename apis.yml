- aid: hootsuite:hootsuite-vai-webhooks-api
  name: Hootsuite Vai Webhooks API
  description: "### Webhook authentication\n\nWhen setting up a virtual agent, you received a secret key\
    \ that you can use to verify whether an incoming webhook\nrequest really comes from Inbox 2.0 without\
    \ alterations. In the request headers of each webhook call is the\n`X-Hootsuite-Signature`. This contains\
    \ an `HMAC-SHA256` signature based on the body of the request. \nBoth the secret key you received\
    \ and the signature are encoded as hexadecimal strings. \nMost languages come with libraries out of\
    \ the box to verify this signature. \nHere is some sample code to verify it in Node.js:\n\n```javascript\n\
    const secret = \"...\"; // do not share!\nconst expectedSignature = request.headers[\"X-Hootsuite-Signature\"\
    ];\nconst actualSignature = crypto\n.createHmac(\"sha256\", Buffer.from(secret, \"hex\"))\n.update(request.body,\
    \ \"utf-8\")\n.digest(\"hex\");\nif (actualSignature !== expectedSignature) {\nthrow new createError.Unauthorized(\"\
    X-Hootsuite-Signature wrong\");\n}\n```\n\nNote: Make sure you calculate the signature off the body\
    \ as is, before you deserialize it from JSON. \nDuring the calculation of the signature, all white\
    \ space is considered significant.\n\nAs part of the request body, you will find a timestamp. This\
    \ is the time a request was sent. To prevent replay attacks,\nwe recommend verifying that this timestamp\
    \ is no older than 5 minutes:\n\n```javascript\nif (moment(JSON.parse(request.body).timestamp).isBefore(moment().subtract(5,\
    \ \"minutes\"))) {\n  throw new createError.Unauthorized(\"Request too old\");\n}\n```\n\n### Events\n\
    \nWhen a conversation is assigned to the virtual agent you registered in the previous section, Inbox\
    \ 2.0 sends you an event via the URL you configured.\n\nThree important events are sent:\n\n  - `CONVERSATION_STARTED`\n\
    \  - `CONVERSATION_DELEGATED`\n  - `INBOUND_MESSAGE_RECEIVED`\n\n### Common fields\n\nAll events have\
    \ certain common fields:\n\n  - type: A string that defines what kind of event occurred (currently\
    \ `CONVERSATION_STARTED`, `CONVERSATION_DELEGATED`, or `INBOUND_MESSAGE_RECEIVED`). \n    New events\
    \ can be added in the future. Avoid responding with an error to unknown\n    values; instead, ignore\
    \ them. Depending on this type, the structure of data will be different.\n  - version: A number designating\
    \ the version of the type of request. Currently, the version is always 1. Versions will be\n    used\
    \ in the future for introducing non-backward-compatible changes.\n  - idempotencyKey: A string that\
    \ uniquely identifies each event. When a timeout occurs when sending you the event, (or we\n    receive\
    \ an error response), we will retry the event. This key can help you to ensure that a request is processed\
    \ only\n    once.\n  - timestamp: The timestamp when we sent the request. This is used to counter\
    \ possible replay attacks.\n  - data: An object that contains structured data for the specific type.\
    \ For example, an `INBOUND_MESSAGE_RECEIVED` type\n    event has fields such as `conversationId` and\
    \ `message`. Fields may be added in the future.\n\n### Requirements\n\nTo provide a good customer\
    \ experience, some non-functional requirements are imposed on the webhook. When a webhook is\nsent,\
    \ you have 10 seconds to respond with a 200 OK. If a timeout occurs, we will retry 3 times using an\
    \ exponential\nbackoff (up to 2 seconds). If the failures persisted during the retries, the assigned\
    \ conversation will be handed over\nto a human agent by placing it in the New queue.\n\nWhen the contact\
    \ sends a message through Inbox 2.0, by default we expect the virtual agent to reply to that message\n\
    within 5 minutes (using either the response to the webhook call or the REST API). You can configure\
    \ the timeout on the\nsettings page for your virtual agent (Timeout virtual agent). If the virtual\
    \ agent does not answer the contact, by\ndefault the conversation is placed in the New queue for a\
    \ human agent to pick up. This can also be configured\nin `Settings`. If you prefer, you can automatically\
    \ resolve the conversation and send a message to the contact (such\nas \"Please try again in a little\
    \ while\"). The virtual agent could also decide to immediately return control by\nsending `RESOLVED`\
    \ or `HANDOVER` in the `complete` field.\n\nSimilarly, after a `CONVERSATION_DELEGATED` event, your\
    \ virtual agent has 5 minutes to pose a question to the contact by\ndefault. If the virtual agent\
    \ fails to do this, the conversation is handed back to the previous owner of the\nconversation or\
    \ placed in the New queue, depending on the handoff rule.\n\n### Response\n\nYour response to the\
    \ webhook should be a status `200 OK`. In the body, you can return the response you want to send to\
    \ the contact:\n  \n  ```json\n  {\n    \"sendMessage\": {\n      \"text\": \"Hi! How can I help you?\"\
    ,\n      \"attachment\": \"funny_cat.gif\"\n    },\n    \"applyTopics\": [\n      \"Hotel Reservation\"\
    \n    ],\n    \"applyTags\": [\n      \"Happy\"\n    ],\n    \"setContactAttributes\": {\n      \"\
    account_number\": \"19758293529351\"\n    },\n    \"complete\": \"HANDOVER\"\n  }\n  ```\n\n- sendMessage:\
    \ (Optional) The message you want to send to the contact. You can send only text, only an attachment,\
    \ or\n  both at the same time. If you want to send an attachment, you must upload it first, so we\
    \ recommend using the\n  asynchronous flow.\n- applyTopics: (Optional) The list of topics you want\
    \ to apply to the conversation (the intent or action that your\n  Virtual Agent matched). Topics that\
    \ do not exist in Inbox 2.0 will be ignored.\n- applyTags: The list of tags you want to apply to the\
    \ message from the contact. Tags that do not exist in Inbox 2.0\n  will be ignored. It's only possible\
    \ to use `applyTags` in response to an `INBOUND_MESSAGE_RECEIVED`. It's also\n  possible to tag a\
    \ specific message by specifying the `messageId`. In that case you can respond\n  using \n  \n  ```json\n\
    \  {\n    \"applyTags\": [{\n        \"messageId\": \"cc75552a-1a78-11e9-855e-6d1e71016abf\", \n \
    \       \"tag\": \"Happy\"\n      }]\n  }\n  ```\n- setContactAttributes: The attributes you want\
    \ to set on a contact. The object is a map between the attribute\n  definition's alias and value to\
    \ set.\n- complete: (Optional) This can be either `HANDOVER` if you want to give the conversation\
    \ to another agent,\n  or `RESOLVED` if you want to resolve the conversation. When you pass HANDOVER,\
    \ the handoff rule you configured in\n  settings determine what will happen next. If the handoff rule\
    \ is \"No one,\" the conversation is placed in the New\n  queue without an owner. Any human agent\
    \ can pick up the conversation. If the rule has been set to \"Previous agent,\"the\n  conversation\
    \ will be assigned back to the previous human agent. If there was no previous agent, the conversation\
    \ is\n  placed in the New queue without an owner.\n  \n  If you are integrating with an asynchronous\
    \ bot platform, you can simply return an empty JSON body {} and send this\n  message using a POST\
    \ request. We also recommend using the REST API when you want to send an attachment. You can respond\n\
    \  with {}, upload an attachment using a PUT request, and then send the attachment using a POST request."
