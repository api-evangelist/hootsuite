- aid: hootsuite:inbox-api
  name: Hootsuite Inbox 2.0 API
  description: >-
    The Inbox 2.0 (formerly Sparkcentral) customer-conversation API — CRM contact attribute
    write-back, the Virtual Agent API for bot-driven conversations and attachments, real-time
    reporting metrics, user presence, queue metrics and proactive messaging. Published as
    OpenAPI 3.1 with six native webhook definitions signed with X-Hootsuite-Signature.
  humanURL: https://developer.hootsuite.com/docs/inbox-overview
