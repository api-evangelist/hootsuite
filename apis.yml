- aid: hootsuite:hootsuite-crm-webhooks-api
  name: Hootsuite CRM Webhooks API
  description: "### Webhook authentication\n\nWhen receiving data from Inbox 2.0, we provide two authentication\
    \ options. Both mechanisms are in place so that you can make sure the request originates from Inbox\
    \ 2.0.\n\n#### Shared secret\n\nIf you choose the shared secret authentication method, a secret will\
    \ be generated for you. This secret allows you to calculate the signature to verify that the call\
    \ originated from Inbox 2.0. With this mechanism, every single request from Inbox 2.0 contains the\
    \ `X-Hootsuite-Signature` header. Here's an example of a request:\n\n```shell\ncurl -X POST https://my-webhook-url\
    \ \\\n  -H 'content-type : application/json' \\\n  -H 'accept: application/json' \\\n  -H 'X-Hootsuite-Signature:\
    \ e6f93239a06e46ae9654fc9ad2fb4e1cc4eb213830a0d94e711570c047e43c57' \\\n  -d '{\n        \"version\"\
    : 2,\n        \"contactProfile\": {\n          \"id\": \"a7a20053-9c54-11eb-a89f-47717a44c639\"\n\
    \        },\n        \"contactAttributes\": [\n          {\"attribute\": \"email\", \"value\": \"\
    fj@example.com\"}\n        ]\n      }'\n```\n\nThe signature is generated using the `HMAC-SHA256`\
    \ algorithm with the shared secret and the request body. \nUse your secret to calculate the signature\
    \ and compare with the given signature. \nBoth the secret key you received and the signature are encoded\
    \ as hexadecimal strings. \nMake sure to convert the shared secret from its hexadecimal representation\
    \ to its binary format before using it. \nMost languages come with libraries out of the box to verify\
    \ this signature. \nFor example, here's how it looks in JavaScript:\n\n```javascript\nconst crypto\
    \ = require(\"crypto\");\nconst secret = \"...\"; // do not share!\nconst expectedSignature = request.headers[\"\
    X-Hootsuite-Signature\"];\nconst actualSignature = crypto\n    .createHmac(\"sha256\", Buffer.from(secret,\
    \ \"hex\"))\n    .update(request.body, \"utf-8\")\n    .digest(\"hex\");\nif (actualSignature !==\
    \ expectedSignature) {\n    throw new createError.Unauthorized(\"X-Hootsuite-Signature wrong\");\n\
    }\nconsole.log(JSON.parse(request.body).email);\n```\n\n#### OAuth\n\nIf your endpoints support OAuth2,\
    \ you can configure your client credentials, a Token URL, and, optionally, a Scope in Inbox 2.0.\n\
    \nWe use the OAuth2 Client Credentials flow to authenticate against your CRM. The Token URL is the\
    \ endpoint where we can authenticate with these credentials and retrieve an access token. To do the\
    \ actual lookup, write back, or notification requests, we use the token in the Authorization Header\
    \ to authenticate."
  humanURL: https://developer.hootsuite.com/docs/api-overview
  baseURL: https://platform.hootsuite.com/v1
