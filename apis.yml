aid: hootsuite
name: Hootsuite
description: Hootsuite is a social media management platform that lets organizations
  schedule posts, monitor conversations, run paid campaigns, and analyze performance
  across LinkedIn, X (Twitter), Facebook, Instagram, TikTok, YouTube, and Pinterest
  from a single dashboard. The platform serves marketers, agencies, and enterprises
  with collaboration, approval, and governance workflows. Hootsuite publishes four
  first-party machine-readable API contracts on platform.hootsuite.com — a 48-operation
  REST API for messages, media, social profiles, members, teams and SCIM 2.0 provisioning;
  an Analytics API for organic and paid metrics; the Inbox 2.0 (Sparkcentral) API for
  CRM, virtual agents, queues and proactive messaging; and the Amplify employee-advocacy
  API — all authenticated with OAuth 2.0. It also serves an RFC 9727 API catalog, RFC 8414
  authorization server metadata and RFC 9728 protected resource metadata.
