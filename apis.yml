- aid: hootsuite:hootsuite-rest-api-authentication-api
  name: Hootsuite Rest API Authentication API
  description: "Follow the steps below to make an authenticated API request.\n\n# 1. Request client credentials\n\
    \n### Step 1: Create your OAuth 2.0 app\nFollow [these steps](https://developer.hootsuite.com/docs/getting-started-with-the-rest-api)\
    \ to set up your app and retrieve your client credentials (`client_id` and `client_secret`):\n\n###\
    \ Step 2: Retrieve the appId of your newly created app\n1. Go to your [Hootsuite Developer Apps](https://hootsuite.com/developers/my-apps)\
    \ dashboard.\n2. Select `edit` for your newly created app.\n3. You can find the appId in the `appId`\
    \ parameter of the browser URL. Ex: `https://hootsuite.com/developers/my-apps/app-directory/app/edit?appId=XXXXXX`\n\
    \n### Step 3: Retrieve the organization ID of your Hootsuite organization\n1. Sign in into your [Hootsuite\
    \ account](https://hootsuite.com).\n2. Select `My profile > Manage accounts and teams`.\n3. Select\
    \ `Teams` for your organization.\n5. You can find the organization ID in the id query parameter in\
    \ your browser's address bar.\n```\nhttps://hootsuite.com/dashboard#/organizations/teams/?id=<your_organization_id>\n\
    ```\n\n### Step 4: Request to link your organization to your app\n1. Add a member to your org that\
    \ is not a paying member\n2. Make sure they have at least admin permission level\n3. Send an email\
    \ to the Development Support Team to link your organization to your app:\n  - To: `dev.support@hootsuite.com`\n\
    \  - Include: \n   - the `appId` you retrieved in *Step 2*\n   - the `organization ID` you retrieved\
    \ in *Step 3*\n   - the `member ID` of the non-paying admin member\n4. Wait for the Development Support\
    \ Team to link your app to your organization.\n\n\n# 2. Generate an access token\n\nWhen the developer\
    \ app is correctly set up, you can use your `client_id` and `client_secret` to retrieve an `access_token`\
    \ to make authorized API requests.\nWhen the `access_token` expires, use the [/oauth2/token](#operation/oauthToken)\
    \ to generate a new token.\n\nThis endpoint requires that you pass in your client credentials (`client_id`\
    \ and `client_secret`) using the HTTP Basic authentication scheme as described in the [OAuth 2.0 specification](https://datatracker.ietf.org/doc/html/rfc6749#section-2.3.1).\n\
    Including your client credentials in the request-body is not supported.\n\nWhen the `access_token`\
    \ expires, the API returns a 401 unauthorized. The client can automate this by generating a new access\n\
    token and replaying the failed request with the fresh access token, as described in the following\
    \ section.\n\n\n\n# 3. Include the access token as a bearer token Authorization header\n\nAdd the\
    \ bearer token in the Authorization header\n\n```text\nAuthorization: Bearer <your_access_token>\n\
    ```\n\nExample request with token\n\n```shell\n$ curl -X GET https://platform.hootsuite.com/inbox/v1/reporting/metrics/agent-availability\
    \ \\ \n   -H 'Authorization: Bearer oZy8FDUHEiZ0mh0j4rUwOT9t5yHouTzBDsn-x_GROB0.rz-pMQzh-1F6VIGwnJZMBwH3SRwDfEHE4CRi-AClpcg'\n\
    ```"
