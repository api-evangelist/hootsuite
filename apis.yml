- aid: hootsuite:amplify-api
  name: Hootsuite Amplify REST API
  description: >-
    The Amplify employee-advocacy API — publish content directly into Amplify, read the
    authenticated member and their organizations, manage advocacy topics, and deobfuscate
    UTM parameters on shared links. Six operations. The published Swagger declares no
    security scheme even though the API is authenticated.
  humanURL: https://developer.hootsuite.com/docs/amplify-overview
  baseURL: https://platform.hootsuite.com/amplify/v1
