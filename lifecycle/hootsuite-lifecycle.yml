description: >-
  Hootsuite's lifecycle posture is announcement-driven rather than protocol-driven. It runs a dated
  developer changelog and an Atlassian Statuspage, and it has publicly deprecated named features
  with dates. It does NOT publish a formal versioning or deprecation policy document, and it does
  not emit RFC 8594 Sunset or Deprecation response headers on any operation in any of its four
  OpenAPI documents.
versioning:
  policy_published: false
  style: uri-path
  current_versions:
    rest-api: v1
    analytics-api: v1
    inbox-api: v1 (plus /inbox/v2/ on the CRM contact-attributes endpoint)
    amplify-api: v1
    scim: v2
    iframe-sdk: '4.1'
  note: >-
    No document states how Hootsuite versions, what constitutes a breaking change, or how long a
    prior version is supported. Version history is only observable for the iFrame SDK, which
    publishes a dated deprecation table.
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  openapi_deprecated_operations: 0
  note: >-
    Zero operations across the REST, Analytics, Inbox 2.0 and Amplify specifications carry
    `deprecated: true`. Deprecations are announced in the changelog and by email instead, with no
    machine-readable signal an agent could act on.
  announced_deprecations:
  - item: iFrame SDK v0.6
