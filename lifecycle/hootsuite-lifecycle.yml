    source: https://developer.hootsuite.com/changelog/iframe-sdk-41
  - item: iFrame SDK v2.0
    status: deprecated
    date: '2018-01-30'
    source: https://developer.hootsuite.com/changelog/iframe-sdk-41
  - item: iFrame SDK v4.0
    status: deprecated
    date: '2021-11-02'
    source: https://developer.hootsuite.com/changelog/iframe-sdk-41
  - item: Assignments Manager SDK function
    status: deprecated
    date: '2022-12-31'
    note: >-
      Hootsuite asked developers to stop calling the Assignments Manager SDK function before the
      end of 2022 as it moved to a new social support system in early 2023.
    source: https://developer.hootsuite.com/changelog/assignments-manager-deprecation
  - item: A set of Facebook profile and post metrics in the Analytics API
    status: deprecated
    date: '2026-06-03'
    note: >-
      Driven by upstream Facebook API changes. Historical data is still returned for dates before
      2026-06-03; the metrics should not be used going forward.
    source: https://developer.hootsuite.com/changelog/changes-to-facebook-metrics
  - item: Posting to Facebook Groups
    status: removed
    note: Surfaced as error code 40024, "Posting to Facebook Groups is no longer supported".
    source: https://apidocs.hootsuite.com/docs/api/swagger.yaml
  unsupported_networks:
    note: >-
      Hootsuite documents that TikTok, YouTube and Bluesky are NOT supported by the publishing API,
      and that Instagram Business profiles cannot be posted to via REST (Instagram Personal only).
      These are standing capability gaps, not deprecations, but they change what an agent can do.
    source: https://developer.hootsuite.com/docs/api-overview
