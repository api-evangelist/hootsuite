description: >-
  Hootsuite sells the platform on seat-based subscription tiers. API access is NOT a priced product
  line: Hootsuite states plainly that the REST API endpoints and the SDK are free to anyone with
  approved developer access. The plan a customer sits on still governs the API indirectly, because
  API calls execute under the caller's dashboard permissions and seat/social-account entitlements,
  and because two capabilities (the Ow.ly URL-shortener API and organization apps used for
  prescreen components) are Enterprise-only.
