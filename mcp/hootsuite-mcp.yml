description: >-
  Hootsuite serves a remote Model Context Protocol endpoint from its own developer-documentation
  host at https://developer.hootsuite.com/mcp. A plain GET returns the plain-text banner
  "This URL can only be accessed with a MCP client." (HTTP 200, content-type text/html, 48 bytes),
  which is the ReadMe documentation-MCP signature - developer.hootsuite.com is a ReadMe-hosted docs
  site (x-render-origin-server: Render, readme-subdomain: hootsuite). It is a documentation server,
  not a wrapper over the Hootsuite REST/Analytics/Inbox operations: no Hootsuite tool exposes
  scheduleMessage, listPosts or any other published operationId.
