openapi: 3.2.0
info:
  description: '![Run in Postman](https://app.getpostman.com/run-collection/eeda0fcdf55ea26bd0ec#?env%5BHootsuite%…'
  version: '1.0'
  title: Hootsuite REST Messages API
  contact:
    email: dev.support@hootsuite.com
  license:
    name: Hootsuite Developer Terms and API License Agreement
    url: https://hootsuite.com/legal/dev-api-terms
servers:
- url: https://platform.hootsuite.com
security:
- OAuth2: []
tags:
- name: Messages
paths:
  /v1/messages:
    post:
      tags:
      - Messages
      operationId: scheduleMessage
      summary: Schedule messages
      description: 'Schedules a message to send on one or more social profiles (except Pinterest). Returns an array of uniquely identifiable messages (one per social profile requested).


        Scheduling a message to Pinterest can not be bundled with any other social profiles.'
      parameters:
      - $ref: '#/components/parameters/bearerToken'
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/Message'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SocialProfileMessagesResponseEnvelope'
        '400':
          description: Bad Request
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorsResponseEnvelope'
    get:
      tags:
      - Messages
      operationId: retrieveMessages
      summary: Retrieve outbound messages
      description: 'Outbound messages are messages that are scheduled or were previously sent. This endpoint returns outbound messages sorted by increasing scheduled send time. Messages pending approval, including those created by and/or actionable by the given user, will also be returned via this API.


        Messages returned can be filtered by social profile or the current state of the message. If more than 50 results are returned a cursor will be automatically created to paginate the results.


        Query Parameters must be URL encoded. For example:


        ```

        ?startTime=2020-01-01T00%3A00%3A00Z

        &endTime=2020-01-15T17%3A55%3A01Z

        &socialProfileIds=1234

        &state=SCHEDULED

        &limit=5

        ```


        To specify multiple social profiles, use the following syntax:


        ```

        ?socialProfileIds=1234&socialProfileIds=5678

        ```'
      parameters:
      - $ref: '#/components/parameters/bearerToken'
      - name: startTime
        in: query
        description: The start date range of messages to be returned. In [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) format.
        required: true
        example: 2020-01-01 00:00:00+00:00
        schema:
          type: string
      - name: endTime
        in: query
        description: The end date range of messages to be returned. In [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) format. Must not be later than 4 weeks from startTime.
        required: true
        example: 2020-01-15 17:55:01+00:00
        schema:
          type: string
      - name: state
        in: query
        description: A filter to return messages with in the matching state. Allowed values are PENDING_APPROVAL, REJECTED, SENT, SCHEDULED and SEND_FAILED_PERMANENTLY.
        required: false
        example: SCHEDULED
        schema:
          type: string
      - name: socialProfileIds
        in: query
        description: A filter to return messages for certain social profiles.
        required: false
        example: '115185509'
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of messages to be returned in the response. Defaults to 50 if not specified. Maximum allowable limit is 100.
        required: false
        schema:
          type: integer
      - name: cursor
        in: query
        description: Cursor to a specific page in the result set. Defaults to the first page.
        required: false
        schema:
          type: string
      - name: includeUnscheduledReviewMsgs
        in: query
        description: Flag to retrieve unscheduled (Send Now) review messages on top of scheduled ones retrieved from time range query.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SocialProfileMessagesResponseEnvelope'
        '400':
          description: Bad Request
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorsResponseEnvelope'
  /v1/messages/{messageId}:
    get:
      tags:
      - Messages
      operationId: retrieveMessage
      summary: Retrieve message
      description: Retrieves a message. A message is always associated with a single social profile. Messages might be unavailable for a brief time during upload to social networks.
      parameters:
      - $ref: '#/components/parameters/bearerToken'
      - name: messageId
        in: path
        description: The message ID.
        required: true
        example: 4138476039
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SocialProfileMessageResponseEnvelope'
        '400':
          description: Bad Request
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorsResponseEnvelope'
    delete:
      tags:
      - Messages
      operationId: deleteMessage
      summary: Delete message
      description: Deletes a message. A message is always associated with a single social profile.
      parameters:
      - $ref: '#/components/parameters/bearerToken'
      - name: messageId
        in: path
        description: The message ID.
        required: true
        example: 4138476039
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorsResponseEnvelope'
  /v1/messages/{messageId}/approve:
    post:
      tags:
      - Messages
      operationId: approveMessage
      summary: Approve message
      description: Approve a message.
      parameters:
      - $ref: '#/components/parameters/bearerToken'
      - name: messageId
        in: path
        description: The message ID.
        required: true
        example: 4138476039
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ApproveMessageRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/EmptyDataEnvelope'
        '400':
          description: Bad Request
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorsResponseEnvelope'
  /v1/messages/{messageId}/reject:
    post:
      tags:
      - Messages
      operationId: rejectMessage
      summary: Reject message
      description: Reject a message.
      parameters:
      - $ref: '#/components/parameters/bearerToken'
      - name: messageId
        in: path
        description: The message ID.
        required: true
        example: 4138476039
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/RejectMessageRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/EmptyDataEnvelope'
        '400':
          description: Bad Request
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorsResponseEnvelope'
  /v1/messages/{messageId}/history:
    get:
      tags:
      - Messages
      operationId: getMessageHistory
      summary: Get message review history
      description: Gets a message's prescreening review history.
      parameters:
      - $ref: '#/components/parameters/bearerToken'
      - name: messageId
        in: path
        description: The message ID.
        required: true
        example: 4138476039
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/MessageReviewResponseEnvelope'
        '400':
          description: Bad Request
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorsResponseEnvelope'
        '404':
          description: Not Found
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorsResponseEnvelope'
components:
  schemas:
    MediaUrl:
      type: object
      properties:
        thumbnailUrl:
          type: string
          description: The thumbnail media URL.
          example: http://static.ow.ly/photos/thumb/cS5.jpg
        url:
          type: string
          description: The media URL.
          example: http://static.ow.ly/photos/normal/cS5.jpg
      description: An ow.ly media URL.
    MessageReviewResponseEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Actions'
    LinkedInV2CompanyTargeting:
      description: Targeting options for LinkedIn Company V2.
      type: object
      properties:
        locations:
          type: array
          description: "Locations to target the message at, expected format of urn:li:geo:{CODE}. [Geo Locations reference](https://learn.microsoft.com/en-us/linkedin/shared/references/v2/standardized-data/locations/geo), \n[Geo Typeahead Locations reference](https://learn.microsoft.com/en-us/linkedin/shared/references/v2/standardized-data/locations/geo-typeahead?tabs=http)\n"
          items:
            type: string
          example:
          - urn:li:geo:103644278
          - urn:li:geo:102095887
        staffCountRanges:
          type: array
          description: 'Staff count to target the message at, expected format of SIZE_{VALUES}.

            Valid values: SIZE_1, SIZE_2_TO_10, SIZE_11_TO_50, SIZE_51_TO_200, SIZE_201_TO_500, SIZE_501_TO_1000,

            SIZE_1001_TO_5000, SIZE_5001_TO_10000, SIZE_10001_OR_MORE

            [Staff count codes reference](https://learn.microsoft.com/en-us/linkedin/shared/references/reference-tables/company-size-codes)

            '
          items:
            type: string
          example:
          - SIZE_1
          - SIZE_51_TO_200
          - SIZE_10001_OR_MORE
        seniorities:
          type: array
          description: 'Seniorities to target the message at, expected format of urn:li:seniority:{CODE}. [Seniorities codes reference](https://learn.microsoft.com/en-us/linkedin/shared/references/reference-tables/seniority-codes)

            '
          items:
            type: string
          example:
          - urn:li:seniority:1
          - urn:li:seniority:2
        industries:
          type: array
          description: 'Industries to target the message at, expected format of urn:li:industry:{CODE}. [Industries codes reference](https://learn.microsoft.com/en-us/linkedin/shared/references/reference-tables/industry-codes-v2)

            '
          items:
            type: string
          example:
          - urn:li:industry:1
          - urn:li:industry:2
        interfaceLocales:
          type: array
          description: 'Languages to target the message at, expected format of {"country":"COUNTRY","language":"language"}. [Language codes reference](https://learn.microsoft.com/en-us/linkedin/shared/references/reference-tables/language-codes)

            Languages can be interpreted as this format: language_COUNTRY, replace in request as necessary.

            '
          items:
            type: object
          example:
          - country: US
            language: en
          - country: ES
            language: es
    LinkedInPrivacy:
      type: object
      properties:
        visibility:
          type: array
          description: LinkedIn visibility rules. At most 1 can be used.
          items:
            type: string
            example: anyone
            enum:
            - anyone
            - connectionsOnly
    RejectMessageRequest:
      type: object
      required:
      - reason
      - sequenceNumber
      properties:
        reason:
          type: string
          description: The rejection reason to be displayed to the creator of the message.
          example: Message contains profanity
        sequenceNumber:
          type: integer
          description: The sequence number of the message being rejected.
          example: 11
        reviewerType:
          type: string
          description: 'The actor that will be rejecting the message. Leaving this field empty will use "EXTERNAL" by default.


            Using "MEMBER" requires that you use a member token to reject a message that is pending approval by that member.

            '
          enum:
          - EXTERNAL
          - MEMBER
    ErrorsResponseEnvelope:
      type: object
      properties:
        errors:
          type: array
          description: The errors response envelope.
          items:
            $ref: '#/components/schemas/Error'
    EmptyDataEnvelope:
      type: object
      properties:
        data:
          description: The data response envelope.
          type: object
    PrivacyOptions:
      type: object
      description: Social network privacy options to be applied when publishing the message.
      properties:
        facebook:
          $ref: '#/components/schemas/FacebookPrivacy'
        linkedIn:
          $ref: '#/components/schemas/LinkedInPrivacy'
    FacebookPrivacy:
      type: object
      properties:
        visibility:
          type: array
          description: Facebook visibility rules. At most 1 can be used.
          items:
            type: string
            example: everyone
            enum:
            - everyone
            - friends
            - friendsOfFriends
    FacebookPageTargeting:
      description: Targeting options for Facebook Page. Note that recently Facebook has deprecated feed targeting fields `ageMax`, `genders`, and `locales`.
      type: object
      properties:
        ageMin:
          type: integer
          description: Minimum age to target the message at. If used, must be value of 13, 17, 18, 19, 21.
          example: 45
        education:
          type: array
          description: Education level to target the message at.
          items:
            type: string
            example: collegeGrad
            enum:
            - highSchool
            - college
            - collegeGrad
        interestedIn:
          type: array
          description: Interested in preferences to target the message at.
          items:
            type: string
            example: female
            enum:
            - male
            - female
        relationshipStatus:
          type: array
          description: Relationship status to target the message at.
          items:
            type: string
            example: single
            enum:
            - single
            - relationship
            - married
            - engaged
        countries:
          type: array
          description: Country to target the message at.
          items:
            type: object
            properties:
              k:
                type: string
                description: The full name of the country being targeted.
                example: Canada
              v:
                type: string
                description: The 2-digit ISO 3166 format code, as provided by Facebook.
                example: CA
        regions:
          type: array
          description: Region to target the message at. Note that regions can only be specified when there is exactly one country targeted. Limit 200.
          items:
            type: object
            properties:
              k:
                type: string
                description: The full name of the region being targeted.
                example: British Columbia
              v:
                type: string
                description: The region key, as provided by Facebook.
                example: '2'
        cities:
          type: array
          description: City to target the message at. Note that cities can only be specified when there is exactly one country targeted. Limit 250.
          items:
            type: object
            properties:
              k:
                type: string
                description: The full name of the city being targeted.
                example: Burnaby, BC
              v:
                type: string
                description: The city key, as provided by Facebook.
                example: '292466'
        zips:
          type: array
          description: Zip/Postal Code to target the message at. Limit 50,000.
          items:
            type: object
            properties:
              k:
                type: string
                description: The name of the zip/postal code being targeted.
                example: K1S
              v:
                type: string
                description: The zip/postal code key, as provided by Facebook.
                example: CA:K1S
    ReviewAction:
      type: object
      properties:
        actorType:
          type: string
          description: The type of actor who performed this review action.
          example: MEMBER
          enum:
          - MEMBER
          - SYSTEM
          - EXTERNAL_REVIEW_V1
        actorId:
          type: string
          description: The ID of the actor that performed this review action.
          example: '12345678'
        actionType:
          type: string
          description: The action performed.
          example: CREATE
          enum:
          - CREATE
          - APPROVE
          - REJECT
          - DELETE
          - RESET
          - EDIT
          - EXPIRE
          - SEND
          - SCHEDULE
          - SENDFAIL
          - SCHEDULEFAIL
        timestamp:
          type: string
          description: The time the review action was performed. Timezone is UTC.
          example: 2017-02-15 18:51:13+00:00
    SocialProfileMessagesResponseEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          description: The data response envelope.
          items:
            $ref: '#/components/schemas/SocialProfileMessage'
        metadata:
          title: metadata
          type: object
          description: The metadata response envelope.
          properties:
            cursor:
              title: cursor
              type: object
              description: The cursor to paginate the results. A cursor will be created if the number of results exceeds the limit set in the query parameters.
              properties:
                next:
                  type: string
                  description: A cursor to the next page of results. This is set to null if no more pages exist.
                  example: 1577887200000:4138476039:0
                previous:
                  type: string
                  description: A cursor to the previous page of results. This is set to null if no previous pages exist.
                  example: 1577887200000:4138476039:1
    LinkedInCompanyTargeting:
      description: Targeting options for LinkedIn Company. Legacy field, please do not use.
      type: object
      properties:
        companySize:
          type: array
          description: 'Company size to target the message at.


            self:             ''Self employed''


            1-10:             ''1 to 10 employees''


            11-50:            ''11 to 50 employees''


            51-200:           ''51 to 200 employees''


            201-500:          ''201 to 500 employees''


            501-1000:         ''501 to 1000 employees''


            1001-5000:        ''1001 to 5000 employees''


            5001-10000:       ''5001 to 10000 employees''


