  version: "1.0"
paths:
  /me/:
    get:
      operationId: get_me
      parameters:
        - description: An optional fields mask
          in: header
          name: X-Fields
          schema:
            type: string
            format: mask
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
      summary: Gets the member information
      tags:
        - me
  /me/messages:
    post:
      operationId: post_messages
      parameters:
        - description: An optional fields mask
          in: header
          name: X-Fields
          schema:
            type: string
            format: mask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagePostData"
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
      summary: Create message using the authenticated member
      tags:
        - me
  /me/organizations:
    get:
      operationId: get_my_organizations
      parameters:
        - description: An optional fields mask
          in: header
          name: X-Fields
          schema:
            type: string
            format: mask
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgListModel"
      summary: Retrieve authenticated members's organizations
      tags:
        - me
  /me/topics:
    get:
      operationId: get_topics
      parameters:
        - description: An optional fields mask
          in: header
          name: X-Fields
          schema:
            type: string
            format: mask
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicListModel"
      summary: Retrieve authenticated members's topics
      tags:
        - me
    post:
      operationId: post_topics
      parameters:
        - description: An optional fields mask
          in: header
          name: X-Fields
          schema:
            type: string
            format: mask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicPostBody"
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicModel"
      summary: Creates a new topic on the member's organization
      tags:
        - me
  /me/utms/deobfuscate:
    post:
      description: |-
        It is important to note that multiple obfuscated member IDs
        can point to a single member ID.
      operationId: post_utms
      parameters:
        - description: An optional fields mask
          in: header
          name: X-Fields
          schema:
            type: string
            format: mask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeobfuscatePostBody"
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionModel"
      summary: Converts obfuscated member IDs back into member IDs
      tags:
        - me
tags:
  - description: Operations that you can do related with your authenticated member
    name: me
x-tagGroups:
  - name: API Reference
    tags:
      - me
servers:
  - url: https://platform.hootsuite.com/amplify/v1
components:
  responses:
    AccessForbiddenToDocument:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ApplicationError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DocumentDoesNotExist:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MaskError:
      description: When any error occurs on mask
    ParseError:
      description: When a mask can't be parsed
    UserDoesNotHavePermission:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Attachment:
      properties:
        mimeType:
          example: image/jpeg
          type: string
        thumbnailUrl:
          example: https://somethumbnail.jpeg
          type: string
        url:
          example: https://somethumbnail.jpeg
          type: string
      type: object
    ConversionModel:
      properties:
        data:
          items:
            $ref: "#/components/schemas/ObfuscationsToMemberIDs"
          type: array
      type: object
    DeobfuscatePostBody:
      properties:
        ids:
          description: Obfuscated memberIDs (max 500 per request)
          example: '[ "ABCDEF", "DEFGHI", "GHIJKL"]'
          items:
            type: string
          type: array
      type: object
    Error:
      properties:
        code:
          description: Amplify error code
          example: 2000
          type: integer
        data:
          description: Additional error data
          example: The message ID 111234 is not correct
          type: object
        message:
          description: Explanation for the error
          example: Message with given ID does not exist
          type: string
      type: object
    ErrorResponse:
      properties:
        errors:
          description: Detailed errors
          items:
            $ref: "#/components/schemas/Error"
          type: array
        message:
          description: Error message
          example: Server could not process your request at this time.
          type: string
      type: object
    Member:
      properties:
        email:
          example: john.doe@hootsuite.com
          type: string
        name:
          description: Member's name
          example: John Doe
          type: string
        roles:
          description: Member's roles
          example:
            - subscriber
            - content_admin
          items:
            type: string
          type: array
      type: object
    MemberResponse:
      properties:
        data:
          $ref: "#/components/schemas/Member"
      type: object
    Message:
      allOf:
        - $ref: "#/components/schemas/MessageCore"
        - properties:
            content:
              description: Detailed message content structure including organic and amplify
                properties
              type: object
            createdDate:
              description: Date of creation
              example: 2017-10-16T16:42:23.141Z
              format: date-time
              type: string
            id:
              description: Unique identifier for the message
              example: 59d6df3c6bc0160ba6e15f73
              type: string
            isDeleted:
              description: It tells if this message is considered deleted or not
              example: false
              type: boolean
            isReshareable:
              description: Whether the message is retweetable on Twitter or reshareable on
                Facebook
              example: false
              type: boolean
            isReshareableWithThoughts:
              description: Whether the message is allowed to be reshared with added comment
              example: false
              type: boolean
            raw_message:
              type: object
            url:
              description: Link shared in the message
              example: http://ow.ly/fjzz30fU6EK
              type: string
          type: object
    MessageCore:
      properties:
        expiryDate:
          description: The date message expired (if any)
          example: 2017-10-23T16:42:23.141Z
          format: date-time
          type: string
        isPinned:
          default: false
          description: Whether the message is featured (shown at the top) on Amplify or not
          example: false
          type: boolean
        isShareable:
          default: true
          description: Returns false for announcements, and true for everything else
          example: true
          type: boolean
        owlyPhotoAttachment:
          allOf:
            - $ref: "#/components/schemas/Attachment"
          description: Original high quality image of the message (suggested to use
            whenever posting message to social networks)
        pdfAttachment:
          type: object
        photoUrl:
          description: URL of the photo shared in the message
          example: https://one-photo.jpeg
          type: string
        privacySettings:
          allOf:
            - $ref: "#/components/schemas/PrivacySettings"
          description: Privacy settings for different social networks
        publishedDate:
          description: The date message was published (made visible to all Amplify users)
          example: 2017-10-16T16:42:23.141Z
          format: date-time
          type: string
        shareableNetworks:
          allOf:
            - $ref: "#/components/schemas/ShareableNetworks"
          description: Map of social networks and whether or not the message can be shared
            in them
        text:
          description: Entire message text
          example: 5 tips to accelerate your career in a hyper-growth company
          type: string
        topics:
          description: List of all topics message is tagged with
          example:
            - HootsuiteLife
            - Career
          items:
            type: string
          type: array
        videoAttachment:
          type: object
      type: object
    MessageListResponse:
      properties:
        data:
          items:
            $ref: "#/components/schemas/Message"
          type: array
      type: object
    MessagePostData:
      allOf:
        - $ref: "#/components/schemas/MessageCore"
        - properties:
            isEditable:
              default: false
              description: Should this message be editable?
              example: false
              type: boolean
            isNativeShareEnabled:
              default: false
              description: Should native share be allowed for the posts in this org?
              example: false
              type: boolean
            isPublished:
              default: false
              description: Has this message been published?
              example: false
              type: boolean
            isSuggested:
              default: false
              description: Whether a message is a suggestion. Message will default to a draft
                post
              example: false
              type: boolean
            photoUriBase64:
              description: Base 64 image URL
              example: data:image/gif;base64,R0lGODlhEAAQAM...
              type: string
            srcNetwork:
              default: ""
              description: Network where we are posting this message from
              type: string
            srcUser:
              default: ""
              description: When the message has been shared by Twitter or Facebook, this field
                will contain the original user that shared the post
              example: twitter_techie
              type: string
            suggestionReason:
              default: ""
              description: Reason why this message was suggested
              type: string
          type: object
    MessageResponse:
      properties:
        data:
          $ref: "#/components/schemas/Message"
      type: object
    ObfuscationsToMemberIDs:
      properties:
        memberID:
          description: Employee memberID
          example: "123456"
          type: string
        obfuscatedID:
          description: Obfuscated memberID
          example: ABCDEF
          type: string
      type: object
    OrgListModel:
      properties:
        data:
          items:
            $ref: "#/components/schemas/Organization"
          type: array
      type: object
    Organization:
      properties:
        enabledNetworks:
          $ref: "#/components/schemas/enabledNetworks"
        hootId:
          description: Hootsuite organization ID
          example: 123456
          type: integer
        id:
          description: ID of the organization
          example: 59d6df3c6bc0160ba6e15f73
          type: string
        name:
          description: Name of the organization
          example: Hootsuite Inc.
          type: string
      type: object
    PrivacySettings:
      properties:
        tiktokbusiness:
          allOf:
            - $ref: "#/components/schemas/TikTokPrivacySettings"
          description: TikTok-specific privacy settings
      type: object
    ShareableNetworks:
      properties:
        facebook:
          example: true
          type: boolean
        facebookpage:
          example: true
          type: boolean
        instagram:
          example: false
          type: boolean
        linkedin:
          example: true
          type: boolean
        tiktokbusiness:
          example: true
          type: boolean
        twitter:
          example: true
          type: boolean
      type: object
    TikTokPrivacySettings:
      properties:
        allowComments:
          default: true
          description: Whether comments are allowed for TikTok posts
          example: true
          type: boolean
        allowDuet:
          default: true
          description: Whether duets are allowed for TikTok posts
          example: true
          type: boolean
        allowStitch:
          default: true
          description: Whether stitching is allowed for TikTok posts
          example: true
          type: boolean
      type: object
    Topic:
      properties:
        count:
          description: Messages tagged with this topic
          example: 0
          type: integer
        lastActivityDate:
          description: Last time a message was tagged with this topic
          example: 2017-10-23T16:42:23.141Z
          format: date-time
          type: string
        name:
          description: Name of the topic
          example: sports
          type: string
        privacy:
          default: opened
          description: Privacy of the topic
          enum:
            - opened
            - closed
          example: opened
          type: string
      type: object
    TopicListModel:
      properties:
        data:
          items:
            $ref: "#/components/schemas/Topic"
          type: array
      type: object
    TopicModel:
      properties:
        data:
          $ref: "#/components/schemas/Topic"
      type: object
    TopicPostBody:
      properties:
        name:
          description: Name of the topic
          example: sports
          type: string
        privacy:
          description: Privacy of the topic
          enum:
            - opened
            - closed
          example: opened
          type: string
      type: object
    enabledNetworks:
      properties:
        facebook:
          example: true
          type: boolean
        facebookpage:
          example: true
          type: boolean
        hootsuite:
          example: true
          type: boolean
        instagram:
          example: false
          type: boolean
        linkedin:
          example: true
          type: boolean
        tiktokbusiness:
          example: true
          type: boolean
        twitter:
          example: true
          type: boolean
      type: object
