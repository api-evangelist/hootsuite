format: vendor
description: Hootsuite does NOT use RFC 9457 problem+json. It returns its own errors[] envelope with content-type
  application/json;charset=utf-8, and publishes a numeric error-code registry of 97 codes inside its own
  OpenAPI info.description. The OAuth 2.0 endpoints are the exception and return RFC 6749 error bodies;
  the SCIM 2.0 endpoints return RFC 7644 SCIM error bodies. That makes three distinct error shapes on
  one host.
envelopes:
- id: ErrorsResponseEnvelope
  applies_to: REST API, Analytics API, Amplify API
  content_type: application/json;charset=utf-8
  shape: '{ "errors": [ { "code": 1234, "message": "...", "id": "...", "resource": { "type": "socialProfile",
    "id": "7534653235" } } ] }'
  fields:
  - name: code
    type: number
    description: Unique number indicating type of error; see error_codes[] below.
  - name: message
    type: string
    description: Human-readable description of the error.
  - name: id
    type: string
    description: Unique error id for tracing purposes. Quote it to dev.support@hootsuite.com.
  - name: resource
    type: object
    description: Optional {type, id} pointing at the field or resource that caused the error.
  note: A partially-failed request returns BOTH data and errors in the same 200 response.
- id: OAuthError
  applies_to: GET /oauth2/auth, POST /oauth2/token
  standard: RFC 6749 section 5.2
  shape: '{ "error": "invalid_grant", "error_description": "...", "error_hint": "...", "error_debug":
    "...", "status_code": 400 }'
  enum:
  - request_unauthorized
  - request_forbidden
  - invalid_request
  - unauthorized_client
  - access_denied
  - unsupported_response_type
  - invalid_scope
  - server_error
  - temporarily_unavailable
  - unsupported_grant_type
  - invalid_grant
  - invalid_client
  - unknown_error
  - not_found
  - invalid_state
  - misconfiguration
  - insufficient_entropy
  - invalid_token
  - token_signature_mismatch
  - token_expired
- id: ScimErrorResponse
  applies_to: /scim/v2/* (SCIM 2.0)
  standard: RFC 7644 section 3.12
  shape: '{ "schemas": ["urn:ietf:params:scim:api:messages:2.0:Error"], "status": "400", "detail": "...",
    "scimType": "invalidValue" }'
  scim_types:
  - invalidSyntax
  - mutability
  - invalidValue
  - uniqueness
