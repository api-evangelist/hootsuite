gaps:
- No remediation guidance is published per code - Hootsuite ships code + one-line title only, so no `action`
  field could be derived without inventing it.
- No HTTP status is mapped to each numeric code in the published table; the mapping has to be observed
  at runtime.
- 429 and 500 are documented in prose but declared on no operation in any spec.
