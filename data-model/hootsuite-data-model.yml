domains:
  count: 4
  note: >-
    Hootsuite is not one data model. The REST platform (organization/member/team/profile/message),
    Analytics (post and profile metrics keyed by profileId), Inbox 2.0 (conversation/contact) and
    Amplify (topic/message) each define their own entities, and the published contracts do not
    declare join keys between them beyond profileId, which Analytics accepts and Inbox does not.
