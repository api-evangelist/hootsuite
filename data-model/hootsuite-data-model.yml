description: >-
  Entity-relationship graph for the Hootsuite platform, derived from $ref links and id-reference
  fields across the four published contracts. The model is organization-rooted: an Organization owns
  Members, Teams and SocialProfiles, and every permission question resolves against that triangle.
  Message is the write-heavy centre - it fans out to many SocialProfiles at once and carries an
  approval sub-model (Reviewer / ReviewAction / reviewState) that most social APIs do not have.
