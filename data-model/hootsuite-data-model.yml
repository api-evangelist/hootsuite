note_on_ids: >-
  Hootsuite ids are bare numeric strings with no type prefix (socialProfileId "1234", organization
  id "8962198", message id "182836179"). An id alone does not identify its own type, so an agent
  must track which field it came from. The Error object's optional `resource: {type, id}` block is
  the only place Hootsuite pairs an id with its type.
